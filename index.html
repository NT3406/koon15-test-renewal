<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Koon15 ต่ออายุที่จอดรถ</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #333;
    }

    .container {
      max-width: 480px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 24px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .row {
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .label {
      font-size: 13px;
      color: #888;
      margin-bottom: 5px;
    }

    .value {
      font-size: 17px;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .error {
      background: #fff1f1;
      color: #c62828;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>🚗 Koon15</h1>

    <div class="subtitle">
      ระบบต่ออายุที่จอดรถ
    </div>

    <div id="loading" class="loading">
      กำลังตรวจสอบข้อมูล...
    </div>

    <div id="data" style="display:none;">

      <div class="row">
        <div class="label">รหัสอ้างอิง</div>
        <div class="value" id="ref"></div>
      </div>

      <div class="row">
        <div class="label">ชื่อผู้เช่า</div>
        <div class="value" id="name"></div>
      </div>

      <div class="row">
        <div class="label">ช่องจอด</div>
        <div class="value" id="slot"></div>
      </div>

      <div class="row">
        <div class="label">รอบเดือน</div>
        <div class="value" id="month"></div>
      </div>

      <div class="row">
        <div class="label">ค่าบริการ</div>
        <div class="value" id="amount"></div>
      </div>

    </div>

    <div id="error" class="error" style="display:none;"></div>

  </div>

</div>

<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbxcPRUNhcp83db0DB2o3fPWtyXW5ENa-IAsHdVPOX9LMS6rsPezfal3z3MZj1lTo-m8/exec';

const params = new URLSearchParams(window.location.search);

const ref = params.get('ref');

if (!ref) {

  showError('ไม่พบรหัสอ้างอิงต่ออายุ');

} else {

  fetch(API_URL + '?ref=' + encodeURIComponent(ref))
    .then(response => response.json())
    .then(data => {

      if (!data.success) {
        showError(data.error || 'ไม่พบข้อมูล');
        return;
      }

      document.getElementById('ref').textContent =
        data.ref;

      document.getElementById('name').textContent =
        data.name;

      document.getElementById('slot').textContent =
        data.slot;

      document.getElementById('month').textContent =
        data.month;

      document.getElementById('amount').textContent =
        Number(data.amount).toLocaleString('th-TH') + ' บาท';

      document.getElementById('loading').style.display =
        'none';

      document.getElementById('data').style.display =
        'block';

    })
    .catch(error => {

      showError('ไม่สามารถเชื่อมต่อระบบได้');

      console.error(error);

    });
}

function showError(message) {

  document.getElementById('loading').style.display =
    'none';

  document.getElementById('error').textContent =
    message;

  document.getElementById('error').style.display =
    'block';
}

</script>

</body>
</html>
