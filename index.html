  <style>
    body {
      margin: 0;

      text-align: center;

    }

      font-size: 14px;

      margin-bottom: 15px;
    }

    .qr-note {

      color: #777;
    }

    /* แนบสลิป */
    #paymentSection {
      display: none;
      margin-top: 25px;
    }

    .payment-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #slipFile {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fafafa;
    }

    #uploadBtn {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #16803c;

      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #uploadBtn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #success {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #eefbf3;
      color: #16803c;
      text-align: center;
      font-weight: bold;
    }
  </style>

</head>

<body>

<div class="container">

  </div>

</div>

<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbxcPRUNhcp83db0DB2o3fPWtyXW5ENa-IAsHdVPOX9LMS6rsPezfal3z3MZj1lTo-m8/exec';

const params =
  new URLSearchParams(
    window.location.search
  );

const ref =
  params.get('ref');


// ==================================================
// โหลดข้อมูลลูกค้า
// ==================================================

if (!ref) {

  showError(
    'ไม่พบรหัสอ้างอิงต่ออายุ'
  );

} else {

  fetch(
    API_URL +
    '?ref=' +
    encodeURIComponent(ref)
  )

  .then(response =>
    response.json()
  )

  .then(data => {

    if (!data.success) {

      showError(
        data.error ||
        'ไม่พบข้อมูล'
      );

      return;
    }

    // แสดงข้อมูลลูกค้า

    document.getElementById(
      'ref'
    ).textContent =
      data.ref;

    document.getElementById(
      'name'
    ).textContent =
      data.name;

    document.getElementById(
      'slot'
    ).textContent =
      data.slot;

    document.getElementById(
      'month'
    ).textContent =
      data.month;

    document.getElementById(
      'amount'
    ).textContent =
      Number(data.amount)
        .toLocaleString('th-TH') +
      ' บาท';


    // ซ่อน Loading

    document.getElementById(
      'loading'
    ).style.display =
      'none';


    // แสดงข้อมูล

    document.getElementById(
      'data'
    ).style.display =
      'block';


    // แสดง QR

    document.getElementById(
      'qrSection'
    ).style.display =
      'block';


    // แสดงส่วนแนบสลิป

    document.getElementById(
      'paymentSection'
    ).style.display =
      'block';

  })

  .catch(error => {

    console.error(error);

    showError(
      'ไม่สามารถเชื่อมต่อระบบได้'
    );

  });

}


// ==================================================
// ส่งสลิป
// ==================================================

function uploadSlip() {

  const fileInput =
    document.getElementById(
      'slipFile'
    );

  const file =
    fileInput.files[0];


  if (!file) {

    showError(
      'กรุณาเลือกไฟล์หลักฐานการชำระเงิน'
    );

    return;
  }


  // จำกัดขนาด 10 MB

  if (
    file.size >
    10 * 1024 * 1024
  ) {

    showError(
      'ไฟล์มีขนาดใหญ่เกินไป กรุณาเลือกไฟล์ไม่เกิน 10 MB'
    );

    return;
  }


  const button =
    document.getElementById(
      'uploadBtn'
    );

  button.disabled =
    true;

  button.textContent =
    'กำลังส่งหลักฐาน...';


  const reader =
    new FileReader();


  reader.onload = function() {

    const base64 =
      reader.result.split(',')[1];


    fetch(
      API_URL,
      {
        method: 'POST',

        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body: JSON.stringify({

          ref: ref,

          fileName:
            file.name,

          fileType:
            file.type,

          fileBase64:
            base64

        })

      }
    )

    .then(response =>
      response.json()
    )

    .then(data => {

      if (!data.success) {

        throw new Error(
          data.error ||
          'ส่งหลักฐานไม่สำเร็จ'
        );

      }


      // ซ่อนส่วนแนบสลิป

      document.getElementById(
        'paymentSection'
      ).style.display =
        'none';


      // แสดงข้อความสำเร็จ

      document.getElementById(
        'success'
      ).textContent =
        '✅ ส่งหลักฐานการชำระเงินเรียบร้อยแล้ว';


      document.getElementById(
        'success'
      ).style.display =
        'block';

    })

    .catch(error => {

      console.error(error);

      button.disabled =
        false;

      button.textContent =
        'ส่งหลักฐานการชำระเงิน';

      showError(
        error.message
      );

    });

  };


  reader.onerror = function() {

    button.disabled =
      false;

    button.textContent =
      'ส่งหลักฐานการชำระเงิน';

    showError(
      'ไม่สามารถอ่านไฟล์ได้'
    );

  };


  reader.readAsDataURL(
    file
  );

}


// ==================================================
// แสดง Error
// ==================================================

function showError(message) {

  document.getElementById(
    'loading'
  ).style.display =
    'none';

  document.getElementById(
    'error'
  ).textContent =
    message;

  document.getElementById(
    'error'
  ).style.display =
    'block';

}

</script>

</body>
