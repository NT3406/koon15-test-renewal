<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Koon15 ต่ออายุที่จอดรถ</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

</head>


<body style="
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 30px 20px;
  max-width: 500px;
  margin: auto;
  background: #ffffff;
">


  <h2>Koon15 ต่ออายุที่จอดรถ</h2>

  <p id="status">
    กำลังเริ่มระบบ...
  </p>


  <!-- ============================================== -->
  <!-- ข้อมูลลูกค้า -->
  <!-- ============================================== -->

  <div
    id="customerData"
    style="display:none;"
  >

    <hr>


    <p>
      <strong>รหัสต่ออายุ</strong>
    </p>

    <p id="renewalCode"></p>


    <p>
      <strong>ชื่อผู้เช่า</strong>
    </p>

    <p id="customerName"></p>


    <p>
      <strong>ช่องจอดรถ</strong>
    </p>

    <p id="parkingSlot"></p>


    <p>
      <strong>รอบเดือน</strong>
    </p>

    <p id="renewalMonth"></p>


    <p>
      <strong>ค่าบริการ</strong>
    </p>

    <p
      id="renewalAmount"
      style="
        font-size:24px;
        font-weight:bold;
      "
    >
    </p>


    <!-- ============================================== -->
    <!-- ส่วนชำระเงิน -->
    <!-- ============================================== -->

    <div
      id="paymentSection"
      style="
        margin-top:30px;
        padding:20px;
        border:1px solid #ddd;
        border-radius:15px;
      "
    >

      <h3>
        ชำระค่าต่ออายุ
      </h3>


      <p>
        กรุณาชำระค่าบริการตามยอดด้านบน
      </p>


      <img
        src="https://nt3406.github.io/koon15-test-renewal/qr-payment.jpg"
        alt="QR Code สำหรับชำระเงิน"
        style="
          width:260px;
          max-width:80%;
          margin:15px auto;
          display:block;
        "
      >


      <p
        style="
          font-size:14px;
          color:#666;
        "
      >
        สแกน QR Code เพื่อชำระเงิน
      </p>


      <!-- ============================================== -->
      <!-- แนบสลิป -->
      <!-- ============================================== -->

      <hr
        style="
          margin:25px 0;
        "
      >


      <h3>
        แนบหลักฐานการชำระเงิน
      </h3>


      <input
        type="file"
        id="slipFile"
        accept="image/*,.pdf"
        style="
          width:100%;
          margin:15px 0;
        "
      >


      <p
        id="fileName"
        style="
          font-size:14px;
          color:#666;
        "
      >
      </p>


      <button
        id="submitButton"
        onclick="submitSlip()"
        style="
          width:100%;
          padding:14px;
          border:none;
          border-radius:10px;
          background:#06C755;
          color:white;
          font-size:17px;
          font-weight:bold;
          cursor:pointer;
        "
      >
        ส่งหลักฐานการชำระเงิน
      </button>


      <p
        id="uploadStatus"
        style="
          margin-top:15px;
          white-space:pre-line;
        "
      >
      </p>


    </div>

  </div>


  <script>


    // ==================================================
    // Production Web App
    // ==================================================

    const backendUrl =
      'https://script.google.com/macros/s/AKfycbxOxtTc9SL07f2u2R_vLF0e91oHCH_uIQ8dcyAYWytFYD8bwAJ7RS94gHIAnh88l-s3DQ/exec';


    // ==================================================
    // LIFF
    // ==================================================

    const LIFF_ID =
      '2011211599-0JqJ9GVy';


    // ==================================================
    // ตัวแปรระบบ
    // ==================================================

    let renewalCode = '';

    let renewalResult = null;


    // ==================================================
    // อ่านรหัสจาก liff.state
    // ==================================================

    function getCodeFromLiffState() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const state =
        params.get('liff.state');


      if (!state) {
        return '';
      }


      try {

        let decodedState =
          decodeURIComponent(state);


        // ----------------------------------------------
        // กรณี state เป็น URL เต็ม
        // ----------------------------------------------

        try {

          const stateUrl =
            new URL(decodedState);


          const code =
            stateUrl.searchParams.get('code') ||
            stateUrl.searchParams.get('ref');


          if (code) {
            return code;
          }

        } catch (e) {
          // ไม่ใช่ URL เต็ม ให้ตรวจต่อ
        }


        // ----------------------------------------------
        // กรณี state เป็น path + query
        // ----------------------------------------------

        const questionIndex =
          decodedState.indexOf('?');


        if (questionIndex !== -1) {

          const queryString =
            decodedState.substring(
              questionIndex + 1
            );


          const stateParams =
            new URLSearchParams(
              queryString
            );


          const code =
            stateParams.get('code') ||
            stateParams.get('ref');


          if (code) {
            return code;
          }

        }


        // ----------------------------------------------
        // กรณี state มี code ตรง ๆ
        // ----------------------------------------------

        const directParams =
          new URLSearchParams(
            decodedState
          );


        return (
          directParams.get('code') ||
          directParams.get('ref') ||
          ''
        );


      } catch (error) {

        return '';

      }

    }


    // ==================================================
    // หา Renewal Code
    // ==================================================

    function getRenewalCode() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      // 1. code ปกติ

      let code =
        params.get('code');


      if (code) {
        return code;
      }


      // 2. ref

      code =
        params.get('ref');


      if (code) {
        return code;
      }


      // 3. liff.state

      code =
        getCodeFromLiffState();


      if (code) {
        return code;
      }


      // 4. sessionStorage

      code =
        sessionStorage.getItem(
          'koon15RenewalCode'
        );


      if (code) {
        return code;
      }


      return '';

    }


    // ==================================================
    // เริ่มระบบ
    // ==================================================

    async function main() {

      const status =
        document.getElementById(
          'status'
        );


      try {


        // ==============================================
        // 1. เริ่ม LIFF
        // ==============================================

        status.innerText =
          'กำลังเริ่มระบบ LINE...';


        await liff.init({

          liffId:
            LIFF_ID

        });


        // ==============================================
        // 2. อ่านรหัสหลัง LIFF init
        // ==============================================

        renewalCode =
          getRenewalCode();


        // ==============================================
        // 3. บันทึกรหัส
        // ==============================================

        if (renewalCode) {

          sessionStorage.setItem(
            'koon15RenewalCode',
            renewalCode
          );

        }


        // ==============================================
        // 4. ตรวจสอบรหัส
        // ==============================================

        if (!renewalCode) {

          status.innerText =
            '❌ ไม่พบรหัสต่ออายุ\n\n' +
            'กรุณาเปิดจากลิงก์ที่ Koon15 ส่งให้ค่ะ';

          return;

        }


        // ==============================================
        // 5. Login LINE
        // ==============================================

        if (!liff.isLoggedIn()) {

          status.innerText =
            'กำลังเข้าสู่ระบบ LINE...';


          liff.login();


          return;

        }


        // ==============================================
        // 6. อ่าน LINE User ID
        // ==============================================

        status.innerText =
          'กำลังตรวจสอบข้อมูล LINE...';


        const profile =
          await liff.getProfile();


        // ==============================================
        // 7. บันทึก LINE User ID
        // ==============================================

        status.innerText =
          'กำลังเชื่อมต่อข้อมูล...';


        await fetch(

          backendUrl +
          '?action=saveLineUserId' +
          '&code=' +
          encodeURIComponent(
            renewalCode
          ) +
          '&userId=' +
          encodeURIComponent(
            profile.userId
          )

        );


        // ==============================================
        // 8. ดึงข้อมูลต่ออายุ
        // ==============================================

        status.innerText =
          'กำลังโหลดข้อมูลการต่ออายุ...';


        const response =
          await fetch(

            backendUrl +
            '?action=getRenewalData' +
            '&code=' +
            encodeURIComponent(
              renewalCode
            )

          );


        const result =
          await response.json();


        // ==============================================
        // 9. ตรวจสอบผลลัพธ์
        // ==============================================

        if (!result.success) {

          throw new Error(

            result.error ||
            'ไม่สามารถโหลดข้อมูลการต่ออายุได้'

          );

        }


        renewalResult =
          result;


        // ==============================================
        // 10. แสดงรหัส
        // ==============================================

        document.getElementById(
          'renewalCode'
        ).innerText =

          result.code ||
          result.ref ||
          renewalCode;


        // ==============================================
        // 11. แสดงชื่อ
        // ==============================================

        document.getElementById(
          'customerName'
        ).innerText =

          result.name ||
          '';


        // ==============================================
        // 12. แสดงช่องจอด
        // ==============================================

        document.getElementById(
          'parkingSlot'
        ).innerText =

          result.slot ||
          '';


        // ==============================================
        // 13. แสดงรอบเดือน
        // ==============================================

        document.getElementById(
          'renewalMonth'
        ).innerText =

          result.month ||
          '';


        // ==============================================
        // 14. แสดงค่าบริการ
        // ==============================================

        if (
          result.amount !== undefined &&
          result.amount !== null &&
          result.amount !== ''
        ) {

          document.getElementById(
            'renewalAmount'
          ).innerText =

            Number(
              result.amount
            ).toLocaleString(
              'th-TH'
            ) +
            ' บาท';

        }


        // ==============================================
        // 15. แสดงข้อมูลลูกค้า
        // ==============================================

        document.getElementById(
          'customerData'
        ).style.display =
          'block';


        status.innerText =
          '✓ ตรวจสอบข้อมูลสำเร็จ';


      } catch (error) {

        console.error(error);


        status.innerText =
          '❌ เกิดข้อผิดพลาด\n\n' +
          error.message;

      }

    }


    // ==================================================
    // แสดงชื่อไฟล์
    // ==================================================

    document
      .getElementById(
        'slipFile'
      )
      .addEventListener(
        'change',
        function() {


          const file =
            this.files[0];


          if (file) {

            document.getElementById(
              'fileName'
            ).innerText =

              'ไฟล์ที่เลือก: ' +
              file.name;

          } else {

            document.getElementById(
              'fileName'
            ).innerText =
              '';

          }

        }
      );


    // ==================================================
    // แปลงไฟล์เป็น Base64
    // ==================================================

    function fileToBase64(file) {

      return new Promise(

        (
          resolve,
          reject
        ) => {


          const reader =
            new FileReader();


          reader.onload =
            () => {

              const base64 =
                reader.result
                  .split(',')[1];


              resolve(
                base64
              );

            };


          reader.onerror =
            reject;


          reader.readAsDataURL(
            file
          );

        }

      );

    }


    // ==================================================
    // ส่งสลิป
    // ==================================================

    async function submitSlip() {


      const fileInput =
        document.getElementById(
          'slipFile'
        );


      const button =
        document.getElementById(
          'submitButton'
        );


      const uploadStatus =
        document.getElementById(
          'uploadStatus'
        );


      const file =
        fileInput.files[0];


      // ==============================================
      // ตรวจสอบไฟล์
      // ==============================================

      if (!file) {

        uploadStatus.innerText =
          '❌ กรุณาเลือกไฟล์สลิปก่อนค่ะ';

        return;

      }


      if (
        file.size >
        10 * 1024 * 1024
      ) {

        uploadStatus.innerText =
          '❌ ไฟล์มีขนาดใหญ่เกิน 10 MB';

        return;

      }


      try {


        button.disabled =
          true;


        button.style.opacity =
          '0.6';


        uploadStatus.innerText =
          'กำลังส่งหลักฐานการชำระเงิน...';


        // ============================================
        // แปลงไฟล์
        // ============================================

        const fileBase64 =
          await fileToBase64(
            file
          );


        // ============================================
        // ส่งไป Apps Script
        // ============================================

        const response =
          await fetch(

            backendUrl,

            {

              method:
                'POST',


              headers: {

                'Content-Type':
                  'text/plain;charset=utf-8'

              },


              body:
                JSON.stringify({

                  ref:
                    renewalCode,

                  fileBase64:
                    fileBase64,

                  fileType:
                    file.type,

                  fileName:
                    file.name

                })

            }

          );


        const result =
          await response.json();


        // ============================================
        // ตรวจสอบผล
        // ============================================

        if (!result.success) {

          throw new Error(

            result.error ||
            'ไม่สามารถส่งหลักฐานได้'

          );

        }


        // ============================================
        // สำเร็จ
        // ============================================

        uploadStatus.innerText =

          '✓ ส่งหลักฐานการชำระเงินเรียบร้อยแล้ว\n\n' +
          'Koon15 ได้รับสลิปของคุณแล้ว\n' +
          'กรุณารอการตรวจสอบค่ะ';


        button.innerText =
          'ส่งสลิปเรียบร้อยแล้ว';


        button.style.background =
          '#888';


        fileInput.disabled =
          true;


      } catch (error) {


        console.error(
          error
        );


        uploadStatus.innerText =

          '❌ ไม่สามารถส่งหลักฐานได้\n\n' +
          error.message;


        button.disabled =
          false;


        button.style.opacity =
          '1';

      }

    }


    // ==================================================
    // เริ่มระบบ
    // ==================================================

    main();

  </script>


</body>
</html>
