<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Koon15 ต่ออายุที่จอดรถ</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body style="
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 40px 20px;
">

  <h2>Koon15 ต่ออายุที่จอดรถ</h2>

  <p id="status">กำลังเริ่มระบบ...</p>

  <div id="customerData" style="display:none;">

    <hr>

    <p>
      <strong>รหัสต่ออายุ</strong>
    </p>
    <p id="renewalCode"></p>

    <p>
      <strong>ชื่อผู้เช่า</strong>
    </p>
    <p id="customerName"></p>

    <p>
      <strong>ช่องจอดรถ</strong>
    </p>
    <p id="parkingSlot"></p>

  </div>

  <script>

    async function main() {

      const status =
        document.getElementById('status');

      try {

        // 1. อ่านรหัสต่ออายุจาก URL
        const params =
          new URLSearchParams(
            window.location.search
          );

        const urlCode =
          params.get('code');

        // 2. เก็บรหัสก่อนเข้า LINE Login
        if (urlCode) {

          sessionStorage.setItem(
            'koon15RenewalCode',
            urlCode
          );

        }

        // 3. ดึงรหัสที่เก็บไว้
        const renewalCode =
          sessionStorage.getItem(
            'koon15RenewalCode'
          );

        if (!renewalCode) {

          status.innerText =
            '❌ ไม่พบรหัสต่ออายุ\n\n' +
            'กรุณาเปิดจากลิงก์ที่ Koon15 ส่งให้ค่ะ';

          return;

        }

        // 4. เริ่ม LIFF
        await liff.init({

          liffId:
            '2011211599-0JqJ9GVy'

        });

        // 5. Login LINE
        if (!liff.isLoggedIn()) {

          status.innerText =
            'กำลังเข้าสู่ระบบ LINE...';

          liff.login();

          return;

        }

        // 6. อ่านข้อมูล LINE
        status.innerText =
          'กำลังตรวจสอบข้อมูล...';

        const profile =
          await liff.getProfile();

        // 7. บันทึก LINE User ID ลงระบบหลัก
        status.innerText =
          'กำลังเชื่อมต่อข้อมูล...';

        const backendUrl =
          'https://script.google.com/macros/s/AKfycbxOxtTc9SL07f2u2R_vLF0e91oHCH_uIQ8dcyAYWytFYD8bwAJ7RS94gHIAnh88l-s3DQ/exec';

        await fetch(

          backendUrl +
          '?action=saveLineUserId' +
          '&code=' +
          encodeURIComponent(renewalCode) +
          '&userId=' +
          encodeURIComponent(profile.userId)

        );

        // 8. ขอข้อมูลลูกค้าจากระบบหลัก
        status.innerText =
          'กำลังโหลดข้อมูลการต่ออายุ...';

        const response =
          await fetch(

            backendUrl +
            '?action=getRenewalData' +
            '&code=' +
            encodeURIComponent(renewalCode)

          );

        const result =
          await response.json();

        // 9. ตรวจสอบผลลัพธ์
        if (!result.success) {

          throw new Error(
            result.error ||
            'ไม่สามารถโหลดข้อมูลได้'
          );

        }

        // 10. แสดงข้อมูล
        document.getElementById(
          'renewalCode'
        ).innerText =
          result.code;

        document.getElementById(
          'customerName'
        ).innerText =
          result.name;

        document.getElementById(
          'parkingSlot'
        ).innerText =
          result.slot;

        document.getElementById(
          'customerData'
        ).style.display =
          'block';

        status.innerText =
          '✓ ตรวจสอบข้อมูลสำเร็จ';

      } catch (error) {

        status.innerText =
          '❌ เกิดข้อผิดพลาด\n\n' +
          error.message;

        console.error(error);

      }

    }

    main();

  </script>

</body>
</html>
