<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Koon15 ต่ออายุที่จอดรถ</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

</head>


<body style="
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 25px 15px;
  max-width: 500px;
  margin: auto;
">


<h2>Koon15 ต่ออายุที่จอดรถ</h2>


<p id="status">
  กำลังเริ่มระบบ...
</p>


<!-- ================================================= -->
<!-- DEBUG -->
<!-- ================================================= -->

<div
  id="debugBox"
  style="
    display:none;
    margin-top:20px;
    padding:15px;
    background:#fff3cd;
    border:1px solid #ffe69c;
    border-radius:10px;
    text-align:left;
    font-size:13px;
    word-break:break-all;
  "
>

  <strong>ข้อมูลตรวจสอบ LIFF</strong>

  <p>
    URL หลังเริ่ม LIFF:
  </p>

  <div id="debugUrl"></div>

  <p>
    Query String:
  </p>

  <div id="debugQuery"></div>

  <p>
    code:
  </p>

  <div id="debugCode"></div>

  <p>
    ref:
  </p>

  <div id="debugRef"></div>

  <p>
    liff.state:
  </p>

  <div id="debugState"></div>

</div>


<!-- ================================================= -->
<!-- CUSTOMER DATA -->
<!-- ================================================= -->

<div
  id="customerData"
  style="display:none;"
>

  <hr>

  <p>
    <strong>รหัสต่ออายุ</strong>
  </p>

  <p id="renewalCode"></p>


  <p>
    <strong>ชื่อผู้เช่า</strong>
  </p>

  <p id="customerName"></p>


  <p>
    <strong>ช่องจอดรถ</strong>
  </p>

  <p id="parkingSlot"></p>


  <p>
    <strong>รอบเดือน</strong>
  </p>

  <p id="renewalMonth"></p>


  <p>
    <strong>ค่าบริการ</strong>
  </p>

  <p
    id="renewalAmount"
    style="
      font-size:24px;
      font-weight:bold;
    "
  >
  </p>


  <!-- ================================================= -->
  <!-- PAYMENT -->
  <!-- ================================================= -->

  <div
    style="
      margin-top:30px;
      padding:20px;
      border:1px solid #ddd;
      border-radius:15px;
    "
  >

    <h3>
      ชำระค่าต่ออายุ
    </h3>

    <p>
      กรุณาชำระค่าบริการตามยอดด้านบน
    </p>


    <img
      src="https://nt3406.github.io/koon15-test-renewal/qr-payment.jpg"
      alt="QR Code"
      style="
        width:260px;
        max-width:80%;
      "
    >


    <hr
      style="
        margin:25px 0;
      "
    >


    <h3>
      แนบหลักฐานการชำระเงิน
    </h3>


    <input
      type="file"
      id="slipFile"
      accept="image/*,.pdf"
      style="
        width:100%;
        margin:15px 0;
      "
    >


    <p
      id="fileName"
      style="
        font-size:14px;
        color:#666;
      "
    >
    </p>


    <button
      id="submitButton"
      onclick="submitSlip()"
      style="
        width:100%;
        padding:14px;
        border:none;
        border-radius:10px;
        background:#06C755;
        color:white;
        font-size:17px;
        font-weight:bold;
      "
    >
      ส่งหลักฐานการชำระเงิน
    </button>


    <p
      id="uploadStatus"
      style="
        margin-top:15px;
        white-space:pre-line;
      "
    >
    </p>

  </div>

</div>


<script>


// =====================================================
// PRODUCTION BACKEND
// =====================================================

const backendUrl =
  'https://script.google.com/macros/s/AKfycbxOxtTc9SL07f2u2R_vLF0e91oHCH_uIQ8dcyAYWytFYD8bwAJ7RS94gHIAnh88l-s3DQ/exec';


// =====================================================
// LIFF ID
// =====================================================

const LIFF_ID =
  '2011211599-0JqJ9GVy';


// =====================================================
// ตัวแปร
// =====================================================

let renewalCode = '';


// =====================================================
// DEBUG FUNCTION
// =====================================================

function showDebug() {

  document.getElementById(
    'debugBox'
  ).style.display = 'block';


  document.getElementById(
    'debugUrl'
  ).innerText =
    window.location.href;


  document.getElementById(
    'debugQuery'
  ).innerText =
    window.location.search || '(ไม่มี)';


  const params =
    new URLSearchParams(
      window.location.search
    );


  document.getElementById(
    'debugCode'
  ).innerText =
    params.get('code') || '(ไม่มี)';


  document.getElementById(
    'debugRef'
  ).innerText =
    params.get('ref') || '(ไม่มี)';


  document.getElementById(
    'debugState'
  ).innerText =
    params.get('liff.state') || '(ไม่มี)';

}


// =====================================================
// หา Code
// =====================================================

function getRenewalCode() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const code =
    params.get('code');


  if (code) {
    return code;
  }


  const ref =
    params.get('ref');


  if (ref) {
    return ref;
  }


  const saved =
    sessionStorage.getItem(
      'koon15RenewalCode'
    );


  if (saved) {
    return saved;
  }


  return '';

}


// =====================================================
// MAIN
// =====================================================

async function main() {

  const status =
    document.getElementById(
      'status'
    );


  try {


    // -------------------------------------------------
    // 1. LIFF INIT
    // -------------------------------------------------

    status.innerText =
      'กำลังเริ่มระบบ LINE...';


    await liff.init({

      liffId:
        LIFF_ID

    });


    // -------------------------------------------------
    // 2. แสดงข้อมูล URL ที่ LINE ส่งมา
    // -------------------------------------------------

    showDebug();


    // -------------------------------------------------
    // 3. อ่าน Code หลัง LIFF INIT
    // -------------------------------------------------

    renewalCode =
      getRenewalCode();


    document.getElementById(
      'debugCode'
    ).innerText =
      renewalCode || '(ไม่พบ code หลัง LIFF init)';


    // -------------------------------------------------
    // 4. ตรวจ Code
    // -------------------------------------------------

    if (!renewalCode) {

      status.innerText =
        '❌ ไม่พบรหัสต่ออายุ';


      return;

    }


    // -------------------------------------------------
    // 5. เก็บ Code
    // -------------------------------------------------

    sessionStorage.setItem(
      'koon15RenewalCode',
      renewalCode
    );


    // -------------------------------------------------
    // 6. LOGIN
    // -------------------------------------------------

    if (!liff.isLoggedIn()) {

      status.innerText =
        'กำลังเข้าสู่ระบบ LINE...';


      liff.login();


      return;

    }


    // -------------------------------------------------
    // 7. PROFILE
    // -------------------------------------------------

    status.innerText =
      'กำลังเชื่อมต่อข้อมูล LINE...';


    const profile =
      await liff.getProfile();


    // -------------------------------------------------
    // 8. SAVE LINE USER ID
    // -------------------------------------------------

    await fetch(

      backendUrl +
      '?action=saveLineUserId' +
      '&code=' +
      encodeURIComponent(
        renewalCode
      ) +
      '&userId=' +
      encodeURIComponent(
        profile.userId
      )

    );


    // -------------------------------------------------
    // 9. GET RENEWAL DATA
    // -------------------------------------------------

    status.innerText =
      'กำลังโหลดข้อมูลการต่ออายุ...';


    const response =
      await fetch(

        backendUrl +
        '?action=getRenewalData' +
        '&code=' +
        encodeURIComponent(
          renewalCode
        )

      );


    const result =
      await response.json();


    // -------------------------------------------------
    // 10. ตรวจผล
    // -------------------------------------------------

    if (!result.success) {

      throw new Error(

        result.error ||
        'ไม่สามารถโหลดข้อมูลได้'

      );

    }


    // -------------------------------------------------
    // 11. แสดงข้อมูล
    // -------------------------------------------------

    document.getElementById(
      'renewalCode'
    ).innerText =
      result.code ||
      renewalCode;


    document.getElementById(
      'customerName'
    ).innerText =
      result.name || '';


    document.getElementById(
      'parkingSlot'
    ).innerText =
      result.slot || '';


    document.getElementById(
      'renewalMonth'
    ).innerText =
      result.month || '';


    if (
      result.amount !== undefined &&
      result.amount !== null &&
      result.amount !== ''
    ) {

      document.getElementById(
        'renewalAmount'
      ).innerText =

        Number(
          result.amount
        ).toLocaleString(
          'th-TH'
        ) +
        ' บาท';

    }


    document.getElementById(
      'customerData'
    ).style.display =
      'block';


    status.innerText =
      '✓ ตรวจสอบข้อมูลสำเร็จ';


  } catch (error) {


    console.error(error);


    showDebug();


    status.innerText =
      '❌ เกิดข้อผิดพลาด\n\n' +
      error.message;

  }

}


// =====================================================
// FILE NAME
// =====================================================

document
  .getElementById(
    'slipFile'
  )
  .addEventListener(
    'change',
    function() {


      const file =
        this.files[0];


      document.getElementById(
        'fileName'
      ).innerText =
        file
          ? 'ไฟล์ที่เลือก: ' + file.name
          : '';

    }
  );


// =====================================================
// FILE → BASE64
// =====================================================

function fileToBase64(file) {

  return new Promise(

    (
      resolve,
      reject
    ) => {


      const reader =
        new FileReader();


      reader.onload =
        function() {

          resolve(
            reader.result.split(',')[1]
          );

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }

  );

}


// =====================================================
// SUBMIT SLIP
// =====================================================

async function submitSlip() {


  const file =
    document.getElementById(
      'slipFile'
    ).files[0];


  const button =
    document.getElementById(
      'submitButton'
    );


  const status =
    document.getElementById(
      'uploadStatus'
    );


  if (!file) {

    status.innerText =
      '❌ กรุณาเลือกไฟล์สลิปก่อนค่ะ';

    return;

  }


  if (
    file.size >
    10 * 1024 * 1024
  ) {

    status.innerText =
      '❌ ไฟล์มีขนาดใหญ่เกิน 10 MB';

    return;

  }


  try {


    button.disabled =
      true;


    status.innerText =
      'กำลังส่งหลักฐานการชำระเงิน...';


    const fileBase64 =
      await fileToBase64(
        file
      );


    const response =
      await fetch(

        backendUrl,

        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify({

              ref:
                renewalCode,

              fileBase64:
                fileBase64,

              fileType:
                file.type,

              fileName:
                file.name

            })

        }

      );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(

        result.error ||
        'ไม่สามารถส่งหลักฐานได้'

      );

    }


    status.innerText =
      '✓ ส่งหลักฐานการชำระเงินเรียบร้อยแล้ว\n\n' +
      'กรุณารอ Koon15 ตรวจสอบค่ะ';


    button.innerText =
      'ส่งสลิปเรียบร้อยแล้ว';


    button.style.background =
      '#888';


    document.getElementById(
      'slipFile'
    ).disabled =
      true;


  } catch (error) {


    console.error(error);


    status.innerText =
      '❌ ไม่สามารถส่งหลักฐานได้\n\n' +
      error.message;


    button.disabled =
      false;

  }

}


// =====================================================
// START
// =====================================================

main();


</script>

</body>
</html>
